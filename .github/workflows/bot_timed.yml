name: Bot TIMED - Estoque e consumo da unidade

on:
  workflow_dispatch:          # execução manual
  schedule:
    # 06:00 UTC = 03:00 em Brasília. Antes dos robôs do CD (04:00 e 04:30),
    # para o painel ficar completo na mesma manhã.
    - cron: '0 6 * * *'

# Nunca acrescentar gatilhos de pull_request: em repositório público, isso
# poderia expor os secrets a um PR de terceiro.

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # se o TIMED travar, para sozinho

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar o robô
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TIMED_BASE_URL:     ${{ secrets.TIMED_BASE_URL }}
          TIMED_USER:         ${{ secrets.TIMED_USER }}
          TIMED_PASS:         ${{ secrets.TIMED_PASS }}
          SHEET_ID:           ${{ secrets.SHEET_ID }}
          ABA_DESTINO:        ${{ vars.ABA_DESTINO }}
          COLUNA_GRUPO:       ${{ vars.COLUNA_GRUPO }}
          SECOES_POR_GRUPO:   ${{ vars.SECOES_POR_GRUPO }}
        run: python scraper_timed.py
